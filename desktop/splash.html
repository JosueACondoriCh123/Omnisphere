<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Iniciando OmniStage</title>
  <style>
    :root { color-scheme: dark; font-family: 'Segoe UI', Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #fff; background: #050608; }
    body::before { content: ''; position: fixed; inset: -20%; background: radial-gradient(circle at 57% 43%, rgba(255, 104, 65, .17), transparent 29%), radial-gradient(circle at 42% 55%, rgba(68, 138, 184, .09), transparent 31%); animation: ambient 9s ease-in-out infinite alternate; }
    main { position: relative; width: min(580px, 88vw); text-align: center; }
    .orb { position: relative; width: 116px; height: 116px; margin: 0 auto 2.2rem; display: grid; place-items: center; border: 1px solid rgba(255, 255, 255, .2); border-radius: 30px; background: linear-gradient(145deg, rgba(255, 135, 91, .17), rgba(15, 17, 25, .9)); box-shadow: 0 22px 90px rgba(255, 102, 58, .16), inset 0 1px rgba(255, 255, 255, .14); animation: arrive .8s ease-out both, breathe 3.5s ease-in-out .8s infinite; }
    .orb::after { content: ''; position: absolute; inset: -10px; border: 1px solid rgba(255, 130, 85, .17); border-radius: 38px; animation: ring 3.5s ease-out infinite; }
    .orb span { font-size: 3.3rem; font-weight: 850; line-height: 1; letter-spacing: -.13em; margin-right: .12em; color: #ff956a; }
    .eyebrow { margin: 0 0 .8rem; color: #ffac83; font-size: .7rem; font-weight: 750; letter-spacing: .26em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.6rem, 6vw, 4.2rem); letter-spacing: -.075em; line-height: 1.05; }
    h1 span { color: #ff8255; }
    .description { margin: 1.1rem auto 2.1rem; max-width: 35rem; color: #bfc4ce; line-height: 1.5; }
    .track { width: min(330px, 100%); height: 4px; margin: auto; overflow: hidden; border-radius: 999px; background: #282d36; }
    .track span { display: block; width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ff754d, #ffb482); animation: travel 1.9s ease-in-out infinite alternate; }
    .state { min-height: 1.5rem; margin: 1rem 0 0; color: #cfd3db; font-size: .85rem; }
    button { display: none; margin: 1.15rem auto 0; min-height: 2.8rem; padding: .7rem 1.1rem; color: #1d0e08; background: #ff9a69; border: 1px solid #ffd0b1; border-radius: 9px; font: inherit; font-weight: 750; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    body[data-phase="error"] button { display: block; }
    body[data-phase="error"] .track span { animation: none; width: 100%; background: #ff6488; }
    body[data-phase="ready"] .track span { animation: none; width: 100%; background: #84efbd; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 50% { box-shadow: 0 22px 105px rgba(255, 102, 58, .28), inset 0 1px rgba(255, 255, 255, .14); } }
    @keyframes ring { 0% { transform: scale(.93); opacity: .55; } 70%, 100% { transform: scale(1.13); opacity: 0; } }
    @keyframes travel { from { transform: translateX(-5%); } to { transform: translateX(200%); } }
    @keyframes ambient { to { transform: translate(3%, -2%) scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .track span { width: 70%; } }
  </style>
</head>
<body data-phase="starting">
  <main>
    <div class="orb" aria-hidden="true"><span>O</span></div>
    <p class="eyebrow">Centro de operaciones</p>
    <h1>OMNI<span>STAGE</span></h1>
    <p class="description">Preparando las salas, el audio y los motores de subtítulos.</p>
    <div class="track" aria-hidden="true"><span></span></div>
    <p class="state" id="state" role="status">Iniciando servicios…</p>
    <button id="retry" type="button">Reintentar inicio</button>
  </main>
  <script>
    const state = document.getElementById('state');
    window.omniSplash.onState(({ phase }) => {
      document.body.dataset.phase = phase;
      state.textContent = phase === 'ready' ? 'Todo listo. Abriendo OmniStage…' :
        phase === 'error' ? 'No se pudo conectar con el backend. Comprobá los servicios y reintentá.' :
        'Iniciando servicios…';
    });
    document.getElementById('retry').addEventListener('click', async () => {
      document.body.dataset.phase = 'starting';
      state.textContent = 'Reintentando conexión…';
      try { await window.omniSplash.retry(); }
      catch { document.body.dataset.phase = 'error'; state.textContent = 'No se pudo reintentar el inicio.'; }
    });
  </script>
</body>
</html>
